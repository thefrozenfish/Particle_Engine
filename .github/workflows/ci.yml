name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  DOTNET_NOLOGO: 1
  DOTNET_CLI_TELEMETRY_OPTOUT: 1

jobs:
  # Core unit tests. net8.0 on all three OS runners; net48 additionally on Windows
  # (Mono is not available on the macOS runners), giving .NET Framework coverage too.
  core:
    name: core tests (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, label: windows-x64 }
          - { os: macos-15-intel, label: macos-intel }
          - { os: macos-latest,   label: macos-arm64 }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Core tests (net8.0)
        shell: bash
        run: >
          dotnet test tests/ParticleEngine.Tests -c Release -f net8.0
          --logger "trx;LogFileName=tests-${{ matrix.label }}-net8.trx"
          --results-directory TestResults

      - name: Core tests (net48, Windows only)
        if: matrix.os == 'windows-latest'
        shell: bash
        run: >
          dotnet test tests/ParticleEngine.Tests -c Release -f net48
          --logger "trx;LogFileName=tests-${{ matrix.label }}-net48.trx"
          --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.label }}
          path: TestResults
          if-no-files-found: ignore

  # Full plugin build on Windows: both .gha targets (net48 + net7.0).
  plugin-windows:
    name: plugin build (windows, net48 + net7.0)
    runs-on: windows-latest
    needs: core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build plugin
        shell: bash
        run: dotnet build src/ParticleEngine.Grasshopper -c Release
      - name: Upload plugin binaries
        uses: actions/upload-artifact@v4
        with:
          name: plugin-windows
          path: |
            src/ParticleEngine.Grasshopper/bin/Release/**/ParticleEngine.gha
            src/ParticleEngine.Grasshopper/bin/Release/**/ParticleEngine.Core.dll

  # macOS only runs modern .NET, so compile-check the net7.0 target there.
  plugin-mac-compile:
    name: plugin build (macOS, net7.0 compile check)
    runs-on: macos-latest
    needs: core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Compile net7.0 target
        shell: bash
        run: dotnet build src/ParticleEngine.Grasshopper -c Release -f net7.0

  # Benchmarks are opt-in (manual dispatch); they print step times and allocations.
  bench:
    name: benchmarks (${{ matrix.label }})
    if: github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, label: windows-x64 }
          - { os: macos-15-intel, label: macos-intel }
          - { os: macos-latest,   label: macos-arm64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Run benchmarks
        shell: bash
        run: |
          mkdir -p bench-results
          dotnet run -c Release --project bench/ParticleEngine.Bench | tee "bench-results/bench-${{ matrix.label }}.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: bench-${{ matrix.label }}
          path: bench-results
          if-no-files-found: ignore
